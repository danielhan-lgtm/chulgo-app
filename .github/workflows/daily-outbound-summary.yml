name: Daily outbound summary

on:
  schedule:
    # 09:05 UTC = 18:05 KST (로컬 백엔드가 18:00에 먼저 올리면 이 실행은 자동 skip)
    # 공개 저장소 cron은 1~2시간 지연이 흔함 + 1차가 API 오류로 실패할 수 있어 2회 예약
    # (이미 올라간 날은 채널 확인 후 skip하므로 중복 없음)
    - cron: "5 9 * * *"
    - cron: "35 10 * * *"
  workflow_dispatch:

jobs:
  post-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Post daily summary to Slack
        env:
          BOXHERO_API_TOKEN: ${{ secrets.BOXHERO_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: 물류_출고
        run: python scripts/daily_outbound_summary.py
