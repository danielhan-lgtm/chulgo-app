name: Daily outbound summary

on:
  # 2026-10-27 자동 발송 중단 — 예약(cron) 제거, 필요 시 수동 실행만 가능
  # (복구하려면 schedule: cron "5 9 * * *" / "35 10 * * *" = 18:05 / 19:35 KST)
  workflow_dispatch:

jobs:
  post-summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Post daily summary to Slack
        env:
          BOXHERO_API_TOKEN: ${{ secrets.BOXHERO_API_TOKEN }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL: 물류_출고
        run: python scripts/daily_outbound_summary.py
